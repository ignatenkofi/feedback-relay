# Офлайн-проверки: юнит-тесты чистых функций защиты воркера, синтаксис SDK,
# валидность реестра проектов. Интеграционные тесты (miniflare) — этап M1.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Ручной запуск нужен деплою (см. джоб deploy): без него единственный способ
  # выкатить реле — приложить к коду посторонний коммит. Это ломается в двух
  # ровно тех случаях, когда выкатка и нужна срочно: после `wrangler rollback`
  # (надо вернуть текущий main, а менять в нём нечего) и после смены секрета
  # воркера (код тот же, а перевыкатить надо).
  workflow_dispatch:

# ОДНА версия wrangler на весь воркфлоу — и для dry-run в `test`, и для реального
# деплоя. Иначе офлайн-гейт врёт, и это не гипотеза: джоб deploy не задавал версию
# вовсе, wrangler-action ставил свой дефолтный 3.90.0, а dry-run бежал на 4.x.
# Воркер импортирует реестр через import attributes (`with { type: 'json' }`),
# которых wrangler 3 не понимает, — dry-run проходил, а деплой падал на сборке
# («Expected ";" but found "with"»), уже в main.
#
# Версия закреплена точно, а не диапазоном: весь смысл гейта в том, что dry-run
# собирает ТЕМ ЖЕ компилятором, что и деплой. Обновлять здесь, в одном месте.
env:
  WRANGLER_VERSION: '4.114.0'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 'lts/*' }
      - name: Worker unit tests
        run: node --test worker/test/worker.test.mjs
        working-directory: .
      - name: Legacy unevie-proxy smoke (offline, injected fetch)
        run: node --test worker/legacy-unevie-proxy/test/smoke.test.mjs
        working-directory: .
      - name: SDK syntax + client_empty smoke
        run: |
          node --check sdk/feedback.js
          node --check sdk/feedback-form.js
          node -e "require('./sdk/feedback.js').send('https://x','p',{text:''}).then(()=>{process.exit(1)},e=>{if(e.code!=='client_empty')process.exit(1)})"
      - name: SDK form unit tests (pure helpers; DOM — вручную через sdk/demo.html)
        run: node --test sdk/test/form.test.js
        working-directory: .
      - name: projects.json valid (keys, channel format, rate ceiling)
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('worker/projects.json','utf8'));
            const known = new Set(['origins','channel','repo','title','emoji','rate','_draft']);
            // #22: кросс-изолятный потолок rate-limit из wrangler.toml. perMin выше него
            // binding обеспечить не может (best-effort только внутри изолята) — не пропускаем молча.
            const toml = fs.readFileSync('worker/wrangler.toml','utf8');
            const cm = toml.match(/simple\s*=\s*\{[^}]*limit\s*=\s*(\d+)/);
            if (!cm) { console.error('cannot read ratelimit binding ceiling from wrangler.toml'); process.exit(1); }
            const ceiling = Number(cm[1]);
            let bad = false;
            for (const [id,cfg] of Object.entries(p)) {
              if (id.startsWith('_')) continue;
              if (!Array.isArray(cfg.origins) || !cfg.channel || !cfg.repo) { console.error('bad project', id); bad = true; continue; }
              for (const k of Object.keys(cfg)) if (!known.has(k)) { console.error('unknown key', id+'.'+k); bad = true; }
              if ('_draft' in cfg && typeof cfg._draft !== 'boolean') { console.error('_draft must be boolean:', id); bad = true; }
              // #13: реальный channel ID (/^C[A-Z0-9]{6,}$/) ИЛИ явный черновик (воркер отвечает 404)
              if (!cfg._draft && !/^C[A-Z0-9]{6,}$/.test(cfg.channel)) {
                console.error('bad channel for', id, '- need /^C[A-Z0-9]{6,}$/ or _draft:true, got', cfg.channel); bad = true;
              }
              // #22: perMin, который binding не в состоянии обеспечить
              if (cfg.rate && Number(cfg.rate.perMin) > ceiling) {
                console.error('rate.perMin', cfg.rate.perMin, 'for', id, 'exceeds binding ceiling', ceiling, '(wrangler.toml / DESIGN.md 8)'); bad = true;
              }
            }
            if (bad) process.exit(1);
            console.log('projects.json OK (rate ceiling', ceiling + '/min)');
          "
      - name: Worker config builds (wrangler dry-run, no account/secrets)
        # #13: ловит синтаксис wrangler.toml и несовместимость import attributes с версией
        # wrangler. --dry-run компилирует бандл без деплоя/аккаунта — offline-friendly.
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --dry-run --outdir /tmp/relay-build
        working-directory: worker
        env:
          CI: 'true'
          WRANGLER_SEND_METRICS: 'false'
      - name: Legacy unevie-proxy config builds (wrangler dry-run, no account/secrets)
        # #8: тот же оффлайн-гард для прокси — синтаксис wrangler.toml + сборка бандла.
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --dry-run --outdir /tmp/proxy-build
        working-directory: worker/legacy-unevie-proxy
        env:
          CI: 'true'
          WRANGLER_SEND_METRICS: 'false'

  # Деплой РЕЛЕ (worker/) на push в main. До этого джоба смерженная правка
  # `worker/projects.json` или `worker/worker.js` жила в main, но не в проде, пока
  # кто-то не вспомнит про `wrangler deploy` — а dry-run выше доказывает лишь
  # сборку. Больнее всего это на реестре: смержил тенанта, забыл задеплоить —
  # тенант отдаёт 404, и узнаёшь от пользователя.
  #
  # Legacy-прокси (worker/legacy-unevie-proxy/) здесь НАМЕРЕННО не деплоится:
  # он уезжает ПОВЕРХ живого воркера `unevie-feedback`, на который смотрит
  # розданный URL, и такой шаг обязан оставаться осознанным (см. его README).
  #
  # Owner-гейт: без секретов CF джоб честно скипается, как pages.yml в атласе.
  deploy:
    name: Deploy relay (owner-гейт)
    needs: test
    # Условие держит ДВА инварианта, и второй важнее первого:
    #   1. деплой не бежит на pull_request (в том числе из форка);
    #   2. деплой возможен ТОЛЬКО с main — при ручном запуске `github.ref` равен
    #      выбранной в UI ветке, поэтому dispatch с произвольной ветки честно
    #      скипнется, а не выкатит непроверенный код в прод.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Гейт публикации (секреты CF)
        id: gate
        env:
          HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_CF" != "true" ]; then
            echo "::notice::секреты Cloudflare не выданы — деплой реле пропущен, нужен ручной 'wrangler deploy' в worker/"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      # Деплоим на каждый push в main, не пытаясь вычислить «менялся ли worker/»:
      # checkout приходит глубиной 1, база `github.event.before` в клоне
      # отсутствует, и такая проверка тихо деградировала бы. Повторный деплой
      # неизменного кода — no-op новой версии, это дешевле хрупкой логики.
      # Так же поступает unevie со своим Pages-деплоем.
      - name: wrangler deploy (relay)
        if: steps.gate.outputs.run == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
